<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tree Evolution</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <model-viewer 
        id="tree-viewer"
        src="assets/models/tree_level_1.glb" 
        alt="3D Tree"
        camera-controls
        disable-zoom
        shadow-intensity="1"
        environment-image="neutral"
        exposure="1"
        interaction-prompt="none"
        /* Настройка под большое дерево: 15 метров дистанция */
        camera-orbit="0deg 80deg 20m" 
        /* Центрируем камеру чуть выше земли */
        camera-target="0m 5m 0m"
        field-of-view="30deg">
    </model-viewer>

    <script src="main.js"></script>
</body>
</html>
