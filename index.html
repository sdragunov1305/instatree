<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tree Growth</title>
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Пиксельный стиль шрифта */
            background-color: #1a1a1a;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
        }

        /* ИНТЕРФЕЙС */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы клики проходили сквозь UI к дереву */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ПРОГРЕСС-БАР ЛАЙКОВ */
        .likes-container {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            width: fit-content;
            border: 2px solid #444;
        }

        .progress-bar-bg {
            width: 250px;
            height: 12px;
            background: #333;
            border-radius: 6px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            width: 45%; /* Управляется через JS */
            height: 100%;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            box-shadow: 0 0 10px #ff8a00;
        }

        /* БОКОВЫЕ ПЛАШКИ */
        .sidebar {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

            width: 180px;
            background: rgba(40, 40, 40, 0.85);
