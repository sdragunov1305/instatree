<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instatree 3D</title>
    <style>
        /* Встроенные стили, чтобы точно всё отобразилось */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a; /* Темный фон, пока грузится 3D */
            color: white;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .sidebar {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .level-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 8px;
            width: 200px;
            backdrop-filter: blur(5px);
        }

        .level-card.active {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .status {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 5px;
        }

        .progress-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            pointer-events: auto;
        }

        .bar {
            width: 300px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        .fill {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
        }
    </style>
</head>
<body>

    <canvas id="bg"></canvas>

    <div id="ui-layer">
        <div class="progress-container">
            <div>ПРОГРЕСС ЛАЙКОВ: 1250 / 2000</div>
            <div class="bar"><div class="fill"></div></div>
        </div>

        <div class="sidebar">
            <div class="level-card">
                <div class="status">✅ ПРОЙДЕНО</div>
                <div>УРОВЕНЬ 1: РОСТОК</div>
            </div>
            <div class="level-card active">
                <div class="status" style="color: #00ffcc;">● ТЕКУЩИЙ</div>
                <div>УРОВЕНЬ 2: САЖЕНЕЦ</div>
            </div>
            <div class="level-card" style="opacity: 0.5;">
                <div class="status">🔒 ЗАБЛОКИРОВАНО</div>
                <div>УРОВЕНЬ 3: ДЕРЕВО</div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
